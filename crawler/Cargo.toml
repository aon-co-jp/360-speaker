[package]
name = "materials-crawler"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "360-speaker: daily crawler that collects candidate loudspeaker-diaphragm materials (arXiv + Crossref)"

[dependencies]
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
