<text x="40" y="1106" font-size="12" text-anchor="start" font-weight="normal" fill="#111">L-padはフィルターの後段(ユニット側)に置くので、フィルターから見た負荷は減衰量によらず一定(WAY1・2=4Ω、WAY3〜5=8Ω)。分割周波数が動かない。</text>
<text x="40" y="1124" font-size="12" text-anchor="start" font-weight="normal" fill="#111">抵抗は無誘導巻線または金属箔(バルク)、接点は金/銀メッキのロータリー。減衰 0〜-20dB(24段)+ミュート。WAY1・2は大電力(50W級)・WAY3〜5は小電力(5W級)の抵抗を選ぶ。</text>
<text x="40" y="1142" font-size="12" text-anchor="start" font-weight="normal" fill="#111">LC値は単独LR4(ラダー)の理論値(分割ごと)。実機はユニットのインピーダンス曲線で変わるためゾベル回路と実測による調整が必須(初期値)。</text>
<text x="40" y="1160" font-size="12" text-anchor="start" font-weight="normal" fill="#111">複数WAYの並列接続: アンプから見た負荷は帯域内で各WAYの4Ω/8Ω。パワーアンプは4Ω負荷対応を選ぶ。</text>

<text x="900" y="340" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・WAY1・2: 2個のコーンが同時に隙間へ向かう押し合い配線(片方を逆極性)。隙間が小さいほど圧縮</text>
<text x="900" y="360" font-size="13" text-anchor="start" font-weight="normal" fill="#111">比が上がり風速が増す→ 超低音は隙間20mm以上を推奨(40Hz・Xmaxで風速11m/s、10mm</text>
<text x="900" y="380" font-size="13" text-anchor="start" font-weight="normal" fill="#111">では22m/sで制限)。</text>
<text x="900" y="408" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・隙間は外へフレア(出口を広げる)して風切り音・圧縮を抑える。前室(コーン間)の共振は1.1〜2.0</text>
<text x="900" y="428" font-size="13" text-anchor="start" font-weight="normal" fill="#111">kHz→ 分割より十分高い。</text>
<text x="900" y="456" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・WAY3〜5: 円錐の半頂角45°で水平放射(反射角=2×半頂角)。縁の隙間は圧縮比1.6以下に。</text>
<text x="900" y="476" font-size="13" text-anchor="start" font-weight="normal" fill="#111">円錐半径は帯域下限の波長に対し大きく(小さいと拡散制御が効かない)。</text>
<text x="900" y="504" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・水平面は円対称で全方位。垂直面は各WAYの位置・開口高さでロービング(縦方向の山谷)が出る→ シミ</text>
<text x="900" y="524" font-size="13" text-anchor="start" font-weight="normal" fill="#111">ュレーターで分割次数・間隔・開口・円錐形状を比較(仰角±30°内のばらつき 約13〜14dB、4.4</text>
<text x="900" y="544" font-size="13" text-anchor="start" font-weight="normal" fill="#111">kHz付近に残る。条件による差は小さい)。</text>
