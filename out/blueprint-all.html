<text x="40" y="1106" font-size="12" text-anchor="start" font-weight="normal" fill="#111">目盛り付きボリュームは各WAYのL-pad(Rs直列+Rp並列)。スピーカー側から見たインピーダンスが減衰量によらず4Ωで一定のため、前段のLC回路の分割周波数が動かない。</text>
<text x="40" y="1126" font-size="12" text-anchor="start" font-weight="normal" fill="#111">抵抗は無誘導巻線または金属箔(バルク)タイプ、接点は金メッキ/銀接点のロータリー。減衰量は 0〜-20dB(24段)+ミュート。</text>
<text x="40" y="1146" font-size="12" text-anchor="start" font-weight="normal" fill="#111">例 -6dB: Rs=2.0Ω, Rp=4.0Ω(許容電力は超低音WAYで大きく取る=50W級、高音WAYは5W級)。-12dB: Rs=3.0Ω, Rp=1.3Ω。</text>
<text x="40" y="1166" font-size="12" text-anchor="start" font-weight="normal" fill="#111">LC値は単独LR2の理論値。実機はドライバーのインピーダンス曲線で変わるため、ゾベル回路・測定による微調整が必須(初期値)。</text>
