<text x="40" y="70" font-size="13" text-anchor="start" font-weight="normal" fill="#111">図2/2  単位mm(初期案)  中心軸の断面。WAY1・2=向き合う2個+環状スリット / WAY3〜5=上向き+吊り下げ円錐</text>
