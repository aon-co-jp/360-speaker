<text x="476.25" y="608.9" font-size="12" text-anchor="start" font-weight="normal" fill="#c0392b">← 隙間12mm(フレア出口18mm)</text>
<rect x="283.5" y="429.80000000000007" width="153.0" height="68.0" fill="#fff" stroke="#999" stroke-width="1.2" />
<text x="446.5" y="467.80000000000007" font-size="12" text-anchor="start" font-weight="normal" fill="#111">WAY3 中音 φ75(後室 密閉)</text>
