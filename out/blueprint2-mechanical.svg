<text x="1110" y="590" font-size="12" text-anchor="middle" font-weight="normal" fill="#111">※ 前後2方向が基本。高域ほど側面(90°)が弱くなる→ WAYごとに45°ずつ回して段積みすると水平のばらつきを減らせる(検討案)。</text>
<text x="780" y="680" font-size="15" text-anchor="start" font-weight="bold" fill="#111">仕様表</text>
<text x="780" y="708" font-size="13" text-anchor="start" font-weight="bold" fill="#111">WAY</text>
<text x="830" y="708" font-size="13" text-anchor="start" font-weight="bold" fill="#111">帯域</text>
<text x="960" y="708" font-size="13" text-anchor="start" font-weight="bold" fill="#111">ユニット(対向×2)</text>
<text x="1200" y="708" font-size="13" text-anchor="start" font-weight="bold" fill="#111">LR2分割</text>
<text x="1400" y="708" font-size="13" text-anchor="start" font-weight="bold" fill="#111">ネットワーク</text>
<line x1="780" y1="714" x2="1600" y2="714" stroke="#111" stroke-width="0.8" />
<text x="780" y="734" font-size="13" text-anchor="start" font-weight="normal" fill="#111">1</text>
<text x="830" y="734" font-size="13" text-anchor="start" font-weight="normal" fill="#111">20-100Hz</text>
<text x="960" y="734" font-size="13" text-anchor="start" font-weight="normal" fill="#111">φ250mm ウーファー</text>
<text x="1200" y="734" font-size="13" text-anchor="start" font-weight="normal" fill="#111">- / LP 100Hz</text>
<text x="1400" y="734" font-size="13" text-anchor="start" font-weight="normal" fill="#111">L・C 図1参照</text>
<line x1="780" y1="740" x2="1600" y2="740" stroke="#111" stroke-width="0.8" />
<text x="780" y="760" font-size="13" text-anchor="start" font-weight="normal" fill="#111">2</text>
<text x="830" y="760" font-size="13" text-anchor="start" font-weight="normal" fill="#111">100-600Hz</text>
<text x="960" y="760" font-size="13" text-anchor="start" font-weight="normal" fill="#111">φ130mm ウーファー</text>
<text x="1200" y="760" font-size="13" text-anchor="start" font-weight="normal" fill="#111">HP 100Hz / LP 600Hz</text>
<text x="1400" y="760" font-size="13" text-anchor="start" font-weight="normal" fill="#111">L・C 図1参照</text>
<line x1="780" y1="766" x2="1600" y2="766" stroke="#111" stroke-width="0.8" />
<text x="780" y="786" font-size="13" text-anchor="start" font-weight="normal" fill="#111">3</text>
<text x="830" y="786" font-size="13" text-anchor="start" font-weight="normal" fill="#111">600Hz-3kHz</text>
<text x="960" y="786" font-size="13" text-anchor="start" font-weight="normal" fill="#111">φ75mm コーン/ドーム</text>
<text x="1200" y="786" font-size="13" text-anchor="start" font-weight="normal" fill="#111">HP 600Hz / LP 3000Hz</text>
<text x="1400" y="786" font-size="13" text-anchor="start" font-weight="normal" fill="#111">L・C 図1参照</text>
<line x1="780" y1="792" x2="1600" y2="792" stroke="#111" stroke-width="0.8" />
<text x="780" y="812" font-size="13" text-anchor="start" font-weight="normal" fill="#111">4</text>
<text x="830" y="812" font-size="13" text-anchor="start" font-weight="normal" fill="#111">3k-12kHz</text>
<text x="960" y="812" font-size="13" text-anchor="start" font-weight="normal" fill="#111">φ25mm ドームツィーター</text>
<text x="1200" y="812" font-size="13" text-anchor="start" font-weight="normal" fill="#111">HP 3000Hz / LP 12000Hz</text>
<text x="1400" y="812" font-size="13" text-anchor="start" font-weight="normal" fill="#111">L・C 図1参照</text>
<line x1="780" y1="818" x2="1600" y2="818" stroke="#111" stroke-width="0.8" />
<text x="780" y="838" font-size="13" text-anchor="start" font-weight="normal" fill="#111">5</text>
<text x="830" y="838" font-size="13" text-anchor="start" font-weight="normal" fill="#111">12k-40kHz+</text>
<text x="960" y="838" font-size="13" text-anchor="start" font-weight="normal" fill="#111">φ19mm リボン/AMT(〜40kHz以上)</text>
<text x="1200" y="838" font-size="13" text-anchor="start" font-weight="normal" fill="#111">HP 12000Hz / -</text>
<text x="1400" y="838" font-size="13" text-anchor="start" font-weight="normal" fill="#111">L・C 図1参照</text>
<line x1="780" y1="844" x2="1600" y2="844" stroke="#111" stroke-width="0.8" />
<text x="780" y="880" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・対向配置は同極性で配線し、前後のユニットが同時に外向き/内向きに動く(反力が打ち消され、箱の振動が減る)。</text>
<text x="780" y="906" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・1台のアンプ→受動ネットワーク(コイル+コンデンサ)→各WAYのL-pad(目盛り付きボリューム)→前後ユニッ</text>
<text x="780" y="926" font-size="13" text-anchor="start" font-weight="normal" fill="#111">トを並列接続(4Ω)。</text>
<text x="780" y="952" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・ボリューム5個: WAY別。劣化を抑えるため可変抵抗でなく無誘導抵抗のステップ式L-pad。-6dB以上絞ると</text>
<text x="780" y="972" font-size="13" text-anchor="start" font-weight="normal" fill="#111">アンプ電力を抵抗が消費する(効率とのトレードオフ)。</text>
<text x="780" y="998" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・超高音はリボン/AMT等で40kHz以上まで再生可能なユニットを選定(例: 帯域を公表している製品の実測を確認</text>
<text x="780" y="1018" font-size="13" text-anchor="start" font-weight="normal" fill="#111">)。</text>
<text x="780" y="1044" font-size="13" text-anchor="start" font-weight="normal" fill="#111">・実機調整: 各WAYの能率差(超低音は-6dB以上絞ることが多い)をL-padの初期値で吸収。ゾベル回路と実測</text>
<text x="780" y="1064" font-size="13" text-anchor="start" font-weight="normal" fill="#111">の微調整が必要。</text>
</svg>