<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>360-speaker シミュレーター</title>
<style>
:root{--bg:#fff;--fg:#1c1c1e;--mut:#666;--bd:#d8d8dc}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececf0;--mut:#9a9aa3;--bd:#33353b}}
body{margin:0 auto;padding:16px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;max-width:1000px}
h1{font-size:20px}h2{font-size:16px;margin:20px 0 6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.way{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;margin:4px 0;border-bottom:1px solid var(--bd);padding-bottom:4px}
canvas{width:100%;border:1px solid var(--bd);border-radius:6px}
select,input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:2px 4px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:right}td:first-child,th:first-child{text-align:left}
.note{color:var(--mut);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
</style></head><body>
<h1>360-speaker シミュレーター <span class="note">(Rust→WASM / 近似モデル)</span></h1>
<div class="row">
 <label>WAY数 <select id="ways"><option>1</option><option>2</option><option>3</option><option>4</option><option selected>5</option></select></label>
 <label>版 <select id="ver"><option value="woofer">通常ウーファー版</option><option value="super">スーパーツィーター版</option><option value="sub">サブウーファー版</option></select></label>
 <label>マスター(左右連動) <input id="master" type="range" min="-30" max="6" value="0" step="0.5"> <span id="mv">0 dB</span></label>
</div>
<h2>各WAY(リング搭載数・ドライバー半径・リング半径・個別ボリューム)</h2>
<div id="ctl"></div>
<div class="grid">
 <div><h2>周波数-方位(水平面, dB)</h2><canvas id="hm" width="600" height="320"></canvas></div>
 <div><h2>極座標 <span id="pf"></span> <input id="fs" type="range" min="0" max="199" value="100"></h2><canvas id="po" width="320" height="320"></canvas></div>
</div>
<h2>周波数特性(青=0°、橙=全方位の最大偏差)</h2><canvas id="fr" width="900" height="240"></canvas>
<p class="note" id="sum"></p>
<h2>エンクロージャー設計(T/Sパラメーター・箱・ポート・壁材)<span class="note">(ユニット値は仮定の代表値。実部品のデータシートで置換)</span></h2>
<div class="row">
 <label>対象WAY <select id="ew"><option value="0">WAY1 超低音(φ200×2)</option><option value="1">WAY2 低音(φ130×2)</option><option value="2">WAY3 中音(φ75×2)</option></select></label>
 <label>型 <select id="ek"><option value="0">密閉</option><option value="1">バスレフ</option></select></label>
 <label>箱内径mm <input id="eid" type="number" style="width:5em"></label>
 <label>高さmm <input id="eh" type="number" style="width:5em"></label>
 <label>ポート径mm <input id="epd" type="number" style="width:4.5em"></label>
 <label>Fb Hz(0=自動) <input id="efb" type="number" value="0" style="width:4em"></label>
</div>
<div class="row">
 <label>Fs <input id="fs0" type="number" style="width:4em"></label><label>Qts <input id="qts" type="number" step="0.01" style="width:4em"></label>
 <label>Vas(L/本) <input id="vas" type="number" style="width:4em"></label><label>Sd(cm²/本) <input id="sd" type="number" style="width:4em"></label>
 <label>Xmax mm <input id="xm" type="number" style="width:4em"></label>
 <label>壁材 <select id="mat"><option value="3.5e9,750,0.3">MDF</option><option value="9e9,680,0.3">白樺合板</option><option value="69e9,2700,0.33">アルミ管</option><option value="3e9,1400,0.38">PVC/ABS管</option><option value="30e9,2300,0.2">レジンコンクリート</option><option value="70e9,1500,0.3">CFRP</option></select></label>
 <label>壁厚mm <input id="tw" type="number" value="25" style="width:4em"></label>
</div>
<canvas id="ec" width="900" height="220"></canvas><div id="eo" class="note"></div>
<h2>ボリューム方式とコスト・採算<span class="note">(単価は推定の初期値。編集して使う。実見積りではない)</span></h2>
<div class="row">
 <label>月産台数 <input id="qty" type="number" value="200" style="width:6em"></label>
 <label>SET組数/台 <input id="pair" type="number" value="1" style="width:4em"></label>
 <label>販売価格/本(円) <input id="price" type="number" value="480000" style="width:8em"></label>
 <label>1WAYあたり部材(円) <input id="base" type="number" value="38000" style="width:7em"></label>
 <label>筐体等の固定部材/本(円) <input id="fixed" type="number" value="60000" style="width:7em"></label>
 <label>構成 <select id="mode"><option value="int">アンプ内蔵(スピーカー側にボリューム)</option><option value="ext" selected>アンプ無し+別売プリ(推奨検討)</option></select></label>
 <label>内蔵アンプ原価/WAY(円) <input id="ampc" type="number" value="9000" style="width:6em"></label>
 <label>WAY別端子対/本(円) <input id="term" type="number" value="1500" style="width:5em"></label>
 <label>プリ筐体・電源(円) <input id="prechas" type="number" value="55000" style="width:6em"></label>
 <label>プリ販売価格(円) <input id="preprice" type="number" value="220000" style="width:7em"></label>
</div>
<div class="row"><label>目標最大音圧 dB@2m <input id="tspl" type="number" value="100" style="width:4em"></label>
 <label>ドライバー能率 dB/1W/1m <input id="sens" type="number" value="86" style="width:4em"></label></div>
<div id="amp" class="note"></div>
<table id="cost"></table><p class="note" id="cv"></p>
<script>
const $=id=>document.getElementById(id);
const XO={5:[150,600,2500,8000],4:[200,1000,5000],3:[300,3000],2:[2500],1:[]};
const PRESET={woofer:[[6,0.07,0.12],[4,0.045,0.10],[3,0.03,0.09],[3,0.015,0.08],[2,0.01,0.07]],
 super:[[6,0.07,0.12],[4,0.045,0.10],[3,0.03,0.09],[3,0.015,0.08],[2,0.006,0.05]],
 sub:[[2,0.13,0.14],[6,0.07,0.12],[4,0.045,0.10],[3,0.03,0.09],[3,0.015,0.08]]};
const NF=200,NA=180,FLO=20,FHI=20000;let W,vols=[0,0,0,0,0],cfg=[],xo=[],data,n=5;
function build(){n=+$('ways').value;cfg=PRESET[$('ver').value].slice(0,n).map(a=>a.slice());xo=XO[n].slice();
 const c=$('ctl');c.innerHTML='';
 for(let i=0;i<n;i++){const d=document.createElement('div');d.className='way';
  d.innerHTML='<b>WAY'+(i+1)+'</b><span>個数<input data-i="'+i+'" data-k="0" type="number" min="1" max="12" value="'+cfg[i][0]+'" style="width:3.5em"> 半径mm<input data-i="'+i+'" data-k="1" type="number" value="'+cfg[i][1]*1000+'" style="width:4.5em"> リングmm<input data-i="'+i+'" data-k="2" type="number" value="'+cfg[i][2]*1000+'" style="width:4.5em">'+(i<n-1?' 分割Hz<input data-x="'+i+'" type="number" value="'+xo[i]+'" style="width:5em">':'')+'<br>音量<input data-v="'+i+'" type="range" min="-20" max="6" step="0.5" value="'+vols[i]+'"></span><span id="vv'+i+'">'+vols[i]+' dB</span>';c.appendChild(d)}
 c.oninput=e=>{const t=e.target;if(t.dataset.v!=null){vols[t.dataset.v]=+t.value;$('vv'+t.dataset.v).textContent=t.value+' dB'}
  else if(t.dataset.x!=null)xo[t.dataset.x]=+t.value;else{const k=+t.dataset.k;cfg[t.dataset.i][k]=k==0?+t.value:+t.value/1000}run()};
 run()}
function run(){if(!W)return;const m=new Float64Array(W.memory.buffer,W.in_ptr(),24);
 for(let i=0;i<5;i++){const c=cfg[i]||[1,.01,.05];m[i*4]=c[0];m[i*4+1]=c[1];m[i*4+2]=c[2];m[i*4+3]=(vols[i]||0)+ +$('master').value}
 for(let i=0;i<4;i++)m[20+i]=xo[i]||1e4;
 const len=W.compute(n,NF,NA,FLO,FHI);data=new Float64Array(W.memory.buffer,W.out_ptr(),len).slice();draw()}
function col(v){const t=Math.max(0,Math.min(1,(v+40)/50));return 'hsl('+(240-240*t)+',80%,'+(25+30*t)+'%)'}
function draw(){const fg=getComputedStyle(document.body).color;
 let c=$('hm').getContext('2d'),w=600,h=320;for(let f=0;f<NF;f++)for(let a=0;a<NA;a++){c.fillStyle=col(data[f*NA+a]);c.fillRect(f*w/NF,a*h/NA,w/NF+1,h/NA+1)}
 c.fillStyle='#fff';c.font='11px sans-serif';[100,1000,10000].forEach(F=>{const x=Math.log(F/FLO)/Math.log(FHI/FLO)*w;c.fillText(F>=1000?F/1000+'k':F,x,h-3)});c.fillText('0°',2,10);c.fillText('180°',2,h/2);
 const fi=+$('fs').value;$('pf').textContent=Math.round(FLO*Math.pow(FHI/FLO,fi/(NF-1)))+' Hz';
 c=$('po').getContext('2d');c.clearRect(0,0,320,320);c.strokeStyle='#8888';c.lineWidth=1;[10,20,30,40].forEach(r=>{c.beginPath();c.arc(160,160,r*3.6,0,7);c.stroke()});
 c.strokeStyle='#2a6df4';c.lineWidth=2;c.beginPath();for(let a=0;a<=NA;a++){const v=data[fi*NA+a%NA];const r=Math.max(0,v+40)*3.6;const th=a/NA*2*Math.PI-Math.PI/2;const x=160+r*Math.cos(th),y=160+r*Math.sin(th);a?c.lineTo(x,y):c.moveTo(x,y)}c.stroke();
 c=$('fr').getContext('2d');c.clearRect(0,0,900,240);c.lineWidth=1.5;let worst=0,wf=0;
 const y=v=>240-(v+50)/70*240;c.strokeStyle='#8888';c.fillStyle=fg;for(let d=-40;d<=10;d+=10){c.beginPath();c.moveTo(0,y(d));c.lineTo(900,y(d));c.stroke();c.fillText(d+'dB',2,y(d)-2)}
 c.strokeStyle='#2a6df4';c.beginPath();for(let f=0;f<NF;f++){const x=f*900/NF;f?c.lineTo(x,y(data[f*NA])):c.moveTo(x,y(data[f*NA]))}c.stroke();
 c.strokeStyle='#e8851a';c.beginPath();for(let f=0;f<NF;f++){let a=-99,b=99;for(let k=0;k<NA;k++){a=Math.max(a,data[f*NA+k]);b=Math.min(b,data[f*NA+k])}const dev=a-b;const fr=FLO*Math.pow(FHI/FLO,f/(NF-1));if(fr>=100&&fr<=8000&&dev>worst){worst=dev;wf=fr}const x=f*900/NF,yy=240-Math.min(dev,30)/30*240;f?c.lineTo(x,yy):c.moveTo(x,yy)}c.stroke();
 $('sum').textContent='100Hz〜8kHzの方位間偏差(最大−最小)の最悪値: '+worst.toFixed(1)+' dB @ '+Math.round(wf)+' Hz。小さいほど360°均一。(橙の縦軸は0〜30dB)';
 cost()}
const VOL={'アナログ ステップ式(目盛り付きロータリー)':1800,'モーター付き可変抵抗(リモコン対応)':1500,'デジタル(エンコーダ+ボリュームIC/DSP)':400,'ハイブリッド(エンコーダ+アナログ減衰IC/リレー、目盛りリング付き) 推奨案':1100};
function cost(){const qty=+$('qty').value,pair=+$('pair').value,price=+$('price').value,base=+$('base').value,fixed=+$('fixed').value,ext=$('mode').value=='ext',ampc=+$('ampc').value,term=+$('term').value,pch=+$('prechas').value,pp=+$('preprice').value;
 // 必要アンプ出力(WAYごと): P[W]=10^((目標-能率-10log n+20log d)/10), d=2m, 非コヒーレント加算
 const t=+$('tspl').value,s=+$('sens').value;let ah='<b>外部アンプ必要出力(WAYごと, 1本あたり目安)</b>: ';
 for(let i=0;i<n;i++){const P=Math.pow(10,(t-s-10*Math.log10(cfg[i][0])+20*Math.log10(2))/10);ah+='WAY'+(i+1)+' '+(P<10?P.toFixed(1):Math.round(P))+'W　'}
 $('amp').innerHTML=ah+'<br>(周波数帯ごとに全帯域ほど必要でないため、実際は上記の1/2〜1/10で足りることが多い。ウーファー側を重点配分)';
 const r=['<tr><th>方式</th><th>ボリューム部</th><th>スピーカー原価/本</th><th>'+(ext?'プリ原価':'-')+'</th><th>粗利率(SP)</th><th>'+(ext?'粗利率(プリ)':'-')+'</th><th>月粗利</th></tr>'];
 for(const k in VOL){const knob=VOL[k]*(n+1);                        // 目盛り付きノブ=WAY数+マスター
  const chan=2*n*(ext?900:0);                                          // プリ内の左右各WAYの出力段(推定)
  let spUnit,preUnit=0,vol;
  if(ext){spUnit=base*n-ampc*n+term*(n+1)+fixed-0;preUnit=knob+chan+pch;vol=knob+chan}
  else{spUnit=base*n+knob+fixed;vol=knob}
  const gs=(price-spUnit)/price,gp=ext?(pp-preUnit)/pp:0;
  const gm=(price-spUnit)*qty*pair*2+(ext?(pp-preUnit)*qty*pair:0);
  r.push('<tr><td>'+k+'</td><td>'+Math.round(vol).toLocaleString()+'円</td><td>'+Math.round(spUnit).toLocaleString()+'円</td><td>'+(ext?Math.round(preUnit).toLocaleString()+'円':'-')+'</td><td>'+(gs*100).toFixed(0)+'%</td><td>'+(ext?(gp*100).toFixed(0)+'%':'-')+'</td><td>'+Math.round(gm).toLocaleString()+'円</td></tr>')}
 $('cost').innerHTML=r.join('');$('cv').textContent=(ext?'アンプ無し: スピーカーはWAY別端子(+サブウーファー端子)のパッシブ、プリ(別売)が個別ボリューム'+(n+1)+'個(目盛り付き)+連動マスターを持つ。':'アンプ内蔵: スピーカー側にボリューム'+(n+1)+'個。')+' 月粗利=(価格−原価)×月産×SET組数×2本(+プリ1台/SET)。粗利率35%超かつ金型・開発費を回収できるかが目安。'}
// ---- エンクロージャー ----
const DRV=[{fs:28,q:.42,v:60,sd:220,x:10,id:380,h:420,pd:100,fb:0,k:1},{fs:55,q:.45,v:12,sd:85,x:5,id:200,h:300,pd:50,fb:0,k:0},{fs:120,q:.6,v:1.5,sd:28,x:2,id:128,h:200,pd:25,fb:0,k:0}];
function eload(){const d=DRV[+$('ew').value];$('fs0').value=d.fs;$('qts').value=d.q;$('vas').value=d.v;$('sd').value=d.sd;$('xm').value=d.x;$('eid').value=d.id;$('eh').value=d.h;$('epd').value=d.pd;$('efb').value=d.fb;$('ek').value=d.k;enc()}
function enc(){if(!W||!W.enc_in_ptr)return;
 const idm=+$('eid').value/1000,hm=+$('eh').value/1000,vb=Math.PI*idm*idm/4*hm*1000*0.85; // 内部部材で15%減
 const i=new Float64Array(W.memory.buffer,W.enc_in_ptr(),11);i.set([+$('fs0').value,+$('qts').value,+$('vas').value,+$('sd').value,+$('xm').value,2,vb,+$('ek').value,+$('epd').value,+$('efb').value,7]);
 W.enclosure();const o=new Float64Array(W.memory.buffer,W.enc_out_ptr(),12).slice(),cv=new Float64Array(W.memory.buffer,W.enc_curve_ptr(),160).slice();
 const m=$('mat').value.split(',').map(Number),t=+$('tw').value/1000,R=idm/2;
 const ring=W.wall(m[0],m[1],R,t,hm,m[2],0),comp=W.wall(m[0],m[1],R,t,hm,m[2],1)*100,mass=W.wall(m[0],m[1],R,t,hm,m[2],2);
 const c=$('ec').getContext('2d');c.clearRect(0,0,900,220);c.strokeStyle='#8888';c.fillStyle=getComputedStyle(document.body).color;
 const y=v=>20+(6-v)/36*190;for(let d=-30;d<=0;d+=10){c.beginPath();c.moveTo(0,y(d));c.lineTo(900,y(d));c.stroke();c.fillText(d+'dB',2,y(d)-2)}
 [20,50,100,200,500,1000].forEach(f=>{const x=Math.log(f/15)/Math.log(200)*900;c.beginPath();c.moveTo(x,0);c.lineTo(x,220);c.stroke();c.fillText(f+'Hz',x+2,214)});
 c.strokeStyle='#2a6df4';c.lineWidth=2;c.beginPath();for(let k=0;k<160;k++){const x=k*900/159;k?c.lineTo(x,y(Math.max(cv[k],-30))):c.moveTo(x,y(Math.max(cv[k],-30)))}c.stroke();
 const vented=+$('ek').value==1,warn=[];
 if(vented&&o[4]>17)warn.push('ポート風速が'+o[4].toFixed(0)+' m/s: 乱流・風切り音の恐れ(目安17m/s以下)→ポート径を拡大/フレア形状/スロット化');
 if(vented&&o[3]>hm*1000*0.9)warn.push('ポート長'+o[3].toFixed(0)+'mmが箱高さを超える → 折り返し/環状スリット/底面放射ポートが必要');
 if(vented&&o[3]<=0)warn.push('ポート径が大きすぎて長さが負 → 径を小さく');
 if(o[2]>1.0&&!vented)warn.push('Qtc>1: 低域がだぶつく → 箱を大きく/吸音材を減らす/EQ');
 if(comp>5)warn.push('壁のたわみ補償'+comp.toFixed(1)+'%: 壁が柔らかい → 厚く/高ヤング率材/補強リブ');
 if(ring<(+$('ew').value==0?600:3000))warn.push('リング共振'+Math.round(ring)+'Hz: 本WAYの帯域内 → 材質変更・制振');
 $('eo').innerHTML='有効容積 '+vb.toFixed(1)+'L(ユニット2個で '+($('vas').value*2)+'L相当のVas) / '+(vented?'Fb '+o[10].toFixed(1)+'Hz, ポート長 '+o[3].toFixed(0)+'mm(径'+$('epd').value+'mm), ポート風速(Xmax時) '+o[4].toFixed(1)+' m/s':'Fc '+o[1].toFixed(1)+'Hz, Qtc '+o[2].toFixed(2))+' / F3 '+o[0].toFixed(1)+'Hz / ピーク '+o[6].toFixed(1)+'dB / Xmax制限SPL@F3 約'+o[8].toFixed(0)+'dB(1m)<br>壁: リング共振 '+Math.round(ring)+'Hz / 壁たわみ(対空気) '+comp.toFixed(1)+'% / 壁質量 '+mass.toFixed(1)+'kg'+(warn.length?'<br><b style="color:#c0392b">⚠ '+warn.join('<br>⚠ ')+'</b>':'<br><b style="color:#2a8a4a">主な警告なし(ただし簡易モデル。実機測定が必要)</b>')}
['ek','eid','eh','epd','efb','fs0','qts','vas','sd','xm','mat','tw'].forEach(i=>$(i).oninput=enc);$('ew').onchange=eload;
$('master').oninput=()=>{$('mv').textContent=$('master').value+' dB';run()};
$('ways').onchange=build;$('ver').onchange=build;$('fs').oninput=()=>data&&draw();
['qty','pair','price','base','fixed','mode','ampc','term','prechas','preprice','tspl','sens'].forEach(i=>$(i).oninput=()=>data&&cost());
fetch('sim.wasm').then(r=>r.arrayBuffer()).then(b=>WebAssembly.instantiate(b)).then(r=>{W=r.instance.exports;build();eload()});
</script></body></html>
